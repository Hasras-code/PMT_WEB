name: deploy-vps

# Live-update: every push to main that passes CI ("backend" workflow)
# triggers a deploy on the temp VPS. Manual runs also supported.
on:
  workflow_run:
    workflows: ["backend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue them instead.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy green CI (manual runs always allowed).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to temp VPS (deploy-only SSH key)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          # Fail fast with a clear message if a secret is missing (instead of
          # a cryptic ssh usage error). Secret values are never printed.
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!v:-}" ]]; then
              echo "ERROR: repository secret $v is not set (Settings → Secrets → Actions)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          # Strip any Windows CRLF from the pasted key, then prove the key
          # parses (prints only the public half fingerprint, safe for logs).
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/pmt_deploy
          chmod 600 ~/.ssh/pmt_deploy
          ssh-keygen -y -f ~/.ssh/pmt_deploy > /dev/null
          echo "deploy key OK, connecting to ${VPS_USER}@${VPS_HOST}..."
          # The server ignores the command and always runs
          # deploy/vps-temp/remote-deploy.sh (forced command): pull --ff-only,
          # deploy.sh, verify.sh. The key cannot open a shell, read secrets,
          # or touch anything outside the PMT deployment.
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -i ~/.ssh/pmt_deploy \
              "${VPS_USER}@${VPS_HOST}" true
