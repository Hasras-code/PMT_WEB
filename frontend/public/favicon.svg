<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Deep obsidian black background -->
  <rect width="100" height="100" rx="24" fill="#08090c" stroke="#eab308" stroke-width="2"/>
  
  <!-- Subtle golden glow -->
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#goldGlow)"/>
  
  <!-- Mathematical Sigma symbol stylized as PMT -->
  <text x="50%" y="58%" 
        font-family="'Inter', system-ui, sans-serif" 
        font-weight="800" 
        font-size="42px" 
        fill="#eab308" 
        text-anchor="middle"
        letter-spacing="-2">
    ∑
  </text>
  <!-- Small PMT text underneath -->
  <text x="50%" y="82%"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="14px"
        fill="#eab308"
        text-anchor="middle"
        letter-spacing="1">
    PMT
  </text>
</svg>