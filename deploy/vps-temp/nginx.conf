# Temp VPS nginx: serve Vite dist, proxy API prefixes to Go service.
# API surface (cmd/api/routes.go): /health/*, /v1/*, /swagger/* (dev only).
# File upload/download URLs are absolute http://<VPS_IP>:8090/v1/files/... so
# the API host port (8090, not 8080 — caddy owns localhost:8080) stays open
# too; this proxy is a convenience + single-origin option.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 55m;

  # API — preserve auth + loop through to Go (90s/120s match cmd/api/app.go).
  location /v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
  location /health/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
  }
  location /swagger/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /swagger {
    return 308 /swagger/;
  }

  # SPA fallback — must be last.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
