services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_local_only
      POSTGRES_DB: lms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  migrate:
    build: .
    profiles: [app]
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://lms:lms_local_only@postgres:5432/lms?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    profiles: [app]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      PUBLIC_API_URL: http://localhost:8080
      DATABASE_URL: postgres://lms:lms_local_only@postgres:5432/lms?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_ADDR: mailpit:1025
      MAIL_FROM: lms@localhost
      STORAGE_DIR: /data/files
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
    volumes:
      - files_data:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
volumes:
  postgres_data:
  files_data:
