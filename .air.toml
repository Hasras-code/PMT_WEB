root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/api ./cmd/api"
entrypoint = ["./tmp/air/api"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = [".git", "tmp", "data", "bin", "vendor", "frontend"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "16s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = true
